name: SCA
run-name: Security Scanning

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      actions: read

    steps:
      - name: Run SCA
        uses: ministryofjustice/devsecops-actions/sca@7dc13c20e2bf541b8a77fa1320a04983b18846f6 # v1.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          renovate-version: '43.55.5'
          disable-node-audit: 'true'

      - name: NPM audit
        run: |
          for attempt in {1..3}; do
            echo "Attempt $attempt..."
            if npm audit --production --audit-level=moderate; then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done
          exit 1

  sca-full:
    name: SCA (compat)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SCA compatibility noop
        run: |
          echo "Compatibility job for org config: .github/workflows/sca.yml:sca-full"
          echo "No-op job - replace with real steps if required"
