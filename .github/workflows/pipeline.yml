name: Validate Build and Deploy

on:
  push:

env:
  NODE_VERSION: '24.18.1'
  SNYK_VERSION: '1.1306.3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ministryofjustice/cica-devsecops-workflows/.github/workflows/reusable-node-ci.yml@v1.0.0
    with:
      test-command: 'npx jest --ci --runInBand --bail --silent --coverage --projects jest.config.js jest.config.jsdom.js'
      lint-command: 'npx eslint .'

  security:
    permissions:
      contents: read
      security-events: write
    uses: ministryofjustice/cica-devsecops-workflows/.github/workflows/reusable-security.yml@v1.0.0
    with:
      snyk-api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}

  # Not yet covered by any reusable workflow in cica-devsecops-workflows — the source
  # Implementation Guide describes "snyk monitor" as belonging to a separate post-merge
  # workflow but never allocates it a file (see docs/inputs.md's note on reusable-security.yml
  # in that repo). Kept inline until that's built.
  snyk-monitor:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/cw-deploy'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Snyk
        run: npm install -g snyk@${{ env.SNYK_VERSION }}
      - name: Get Snyk OAuth token
        id: snyk-auth
        uses: ./.github/actions/snyk-auth
        with:
          client-id: ${{ secrets.SNYK_CLIENT_ID }}
          client-secret: ${{ secrets.SNYK_CLIENT_SECRET }}
          api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
      - name: Snyk monitor
        run: snyk monitor
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}

  container:
    needs: [ci, security]
    permissions:
      contents: read
      security-events: write
    uses: ministryofjustice/cica-devsecops-workflows/.github/workflows/reusable-container.yml@v1.0.0
    with:
      image-name: cica/cica-repo-dev
      smoke-test-container-port: 3000
      snyk-api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}

  publish:
    needs: container
    if: |
      github.ref == 'refs/heads/cw-deploy' ||
      github.ref == 'refs/heads/cw-deploy-to-uat' ||
      github.ref == 'refs/heads/cw-deploy-to-staging'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ministryofjustice/cica-devsecops-workflows/.github/workflows/reusable-publish.yml@v1.0.0
    with:
      image-name: cica/cica-repo-dev
      ecr-region: ${{ vars.ECR_REGION }}
      ecr-repository: ${{ vars.ECR_REPOSITORY }}
      run-container-monitor: ${{ github.ref == 'refs/heads/cw-deploy' }}
      snyk-api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
      ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}

  deploy-dev:
    needs: publish
    if: github.ref == 'refs/heads/cw-deploy'
    uses: ministryofjustice/cica-devsecops-workflows/.github/workflows/reusable-deploy-kubernetes.yml@v1.0.0
    with:
      environment: dev
      namespace: claim-criminal-injuries-compensation-dev
      manifest-dir: kube_deploy/Dev
      container-name: webapp
      image-uri: ${{ needs.publish.outputs.image-uri }}
      additional-rollout-restart-deployment: custom-errors
    secrets:
      KUBE_CERT: ${{ secrets.KUBE_CERT }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

  deploy-prod:
    needs: [publish, deploy-dev]
    if: github.ref == 'refs/heads/cw-deploy'
    uses: ministryofjustice/cica-devsecops-workflows/.github/workflows/reusable-deploy-kubernetes.yml@v1.0.0
    with:
      environment: prod
      namespace: claim-criminal-injuries-compensation-prod
      manifest-dir: kube_deploy/Prod
      container-name: webapp
      image-uri: ${{ needs.publish.outputs.image-uri }}
      additional-rollout-restart-deployment: custom-errors
    secrets:
      KUBE_CERT: ${{ secrets.KUBE_CERT }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

  deploy-uat:
    needs: publish
    if: github.ref == 'refs/heads/cw-deploy-to-uat'
    uses: ministryofjustice/cica-devsecops-workflows/.github/workflows/reusable-deploy-kubernetes.yml@v1.0.0
    with:
      environment: uat
      namespace: claim-criminal-injuries-compensation-uat
      manifest-dir: kube_deploy/Uat
      container-name: webapp
      image-uri: ${{ needs.publish.outputs.image-uri }}
      additional-rollout-restart-deployment: custom-errors
    secrets:
      KUBE_CERT: ${{ secrets.KUBE_CERT }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

  deploy-staging:
    needs: publish
    if: github.ref == 'refs/heads/cw-deploy-to-staging'
    uses: ministryofjustice/cica-devsecops-workflows/.github/workflows/reusable-deploy-kubernetes.yml@v1.0.0
    with:
      environment: staging
      namespace: claim-criminal-injuries-compensation-stag
      manifest-dir: kube_deploy/Stag
      container-name: webapp
      image-uri: ${{ needs.publish.outputs.image-uri }}
      additional-rollout-restart-deployment: custom-errors
    secrets:
      KUBE_CERT: ${{ secrets.KUBE_CERT }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
