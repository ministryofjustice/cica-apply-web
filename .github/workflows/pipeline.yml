name: Validate Build and Deploy

on:
  push:

env:
  NODE_VERSION: '24.18.1'
  SNYK_VERSION: '1.1306.3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-action-pinning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate GitHub Action pinning
        run: |
          set -euo pipefail
          echo "=== CHECKING GITHUB ACTION PINNING ==="
          UNPINNED_COUNT=0
          while IFS= read -r WORKFLOW_FILE; do
            while IFS=: read -r LINE_NUMBER LINE_CONTENT; do
              ACTION_REF=$(echo "$LINE_CONTENT" | sed -nE 's/.*uses:[[:space:]]*([^[:space:]#]+).*/\1/p')
              if [ -z "$ACTION_REF" ]; then
                continue
              fi
              REF="${ACTION_REF##*@}"
              if ! echo "$REF" | grep -Eq '^[a-f0-9]{40}$'; then
                echo "::error file=${WORKFLOW_FILE},line=${LINE_NUMBER}::GitHub Action is not pinned to a full commit SHA: ${ACTION_REF}"
                UNPINNED_COUNT=$((UNPINNED_COUNT + 1))
              fi
            done < <(grep -nE 'uses:[[:space:]]*[^[:space:]#]+@[^[:space:]#]+' "$WORKFLOW_FILE" || true)
          done < <(find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) | sort)
          if [ "$UNPINNED_COUNT" -gt 0 ]; then
            echo "❌ $UNPINNED_COUNT unpinned GitHub Action reference(s) found"
            echo "All GitHub Actions must be pinned to a full commit SHA."
            exit 1
          fi
          echo "✅ All GitHub Actions are pinned to full commit SHAs"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          extra_args: --only-verified

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate

  test:
    runs-on: ubuntu-latest
    needs: npm-audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run tests and code coverage
        run: npx jest --ci --runInBand --bail --silent --coverage --projects jest.config.js jest.config.jsdom.js

  lint:
    runs-on: ubuntu-latest
    needs: npm-audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint codebase
        run: npx eslint .

  snyk-open-source:
    runs-on: ubuntu-latest
    needs: npm-audit
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Snyk
        run: npm install -g snyk@${{ env.SNYK_VERSION }}
      - name: Get Snyk OAuth token
        id: snyk-auth
        uses: ./.github/actions/snyk-auth
        with:
          client-id: ${{ secrets.SNYK_CLIENT_ID }}
          client-secret: ${{ secrets.SNYK_CLIENT_SECRET }}
          api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
      - name: Snyk test
        run: snyk test --severity-threshold=high --sarif-file-output=snyk-open-source.sarif
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}
      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('snyk-open-source.sarif') != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: snyk-open-source.sarif
          category: snyk-open-source

  snyk-monitor:
    runs-on: ubuntu-latest
    needs: npm-audit
    if: github.ref == 'refs/heads/cw-deploy'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Snyk
        run: npm install -g snyk@${{ env.SNYK_VERSION }}
      - name: Get Snyk OAuth token
        id: snyk-auth
        uses: ./.github/actions/snyk-auth
        with:
          client-id: ${{ secrets.SNYK_CLIENT_ID }}
          client-secret: ${{ secrets.SNYK_CLIENT_SECRET }}
          api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
      - name: Snyk monitor
        run: snyk monitor
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}

  snyk-code:
    runs-on: ubuntu-latest
    needs: npm-audit
    # Informational only for now: new control, findings not yet triaged.
    # Drop continue-on-error once the team has reviewed and cleared/suppressed existing results.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Snyk
        run: npm install -g snyk@${{ env.SNYK_VERSION }}
      - name: Get Snyk OAuth token
        id: snyk-auth
        uses: ./.github/actions/snyk-auth
        with:
          client-id: ${{ secrets.SNYK_CLIENT_ID }}
          client-secret: ${{ secrets.SNYK_CLIENT_SECRET }}
          api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
      - name: Snyk Code test
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}
      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  snyk-iac:
    runs-on: ubuntu-latest
    needs: npm-audit
    # Informational only for now: new control, findings not yet triaged.
    # Drop continue-on-error once the team has reviewed and cleared/suppressed existing results.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Snyk
        run: npm install -g snyk@${{ env.SNYK_VERSION }}
      - name: Get Snyk OAuth token
        id: snyk-auth
        uses: ./.github/actions/snyk-auth
        with:
          client-id: ${{ secrets.SNYK_CLIENT_ID }}
          client-secret: ${{ secrets.SNYK_CLIENT_SECRET }}
          api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
      - name: Snyk IaC test
        run: snyk iac test kube_deploy/ --severity-threshold=high --sarif-file-output=snyk-iac.sarif
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}
      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('snyk-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, lint, snyk-open-source, validate-action-pinning, secret-scan]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build docker image
        run: docker build --target production --no-cache -t cica/cica-repo-dev .
      - name: Install Snyk
        run: npm install -g snyk@${{ env.SNYK_VERSION }}
      - name: Get Snyk OAuth token
        id: snyk-auth
        uses: ./.github/actions/snyk-auth
        with:
          client-id: ${{ secrets.SNYK_CLIENT_ID }}
          client-secret: ${{ secrets.SNYK_CLIENT_SECRET }}
          api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
      - name: Snyk container scan
        run: snyk container test cica/cica-repo-dev --file=Dockerfile --severity-threshold=high --policy-path=.snyk --sarif-file-output=snyk-container.sarif
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}
      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('snyk-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container
      - name: Archive Docker image
        run: docker save -o image.tar cica/cica-repo-dev:latest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  container-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
      - name: Load archived Docker image
        run: docker load -i image.tar
      - name: Test the container
        run: |
          docker run -d -p 3001:3000 --restart=always --name cica-repo-dev cica/cica-repo-dev:latest
          docker ps
          docker stop cica-repo-dev
          docker ps

  sbom-generate:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
      - name: Load archived Docker image
        run: docker load -i image.tar
      - name: Install Snyk
        run: npm install -g snyk@${{ env.SNYK_VERSION }}
      - name: Get Snyk OAuth token
        id: snyk-auth
        uses: ./.github/actions/snyk-auth
        with:
          client-id: ${{ secrets.SNYK_CLIENT_ID }}
          client-secret: ${{ secrets.SNYK_CLIENT_SECRET }}
          api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
      - name: Generate container SBOM
        run: snyk container sbom cica/cica-repo-dev --format=cyclonedx1.6+json > container-sbom.cyclonedx.json
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-sbom
          path: container-sbom.cyclonedx.json
          retention-days: 90

  publish-image:
    runs-on: ubuntu-latest
    needs: container-smoke-test
    if: |
      github.ref == 'refs/heads/cw-deploy' ||
      github.ref == 'refs/heads/cw-deploy-to-uat' ||
      github.ref == 'refs/heads/cw-deploy-to-staging'
    permissions:
      id-token: write
      contents: read
    outputs:
      image_digest: ${{ steps.image-digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
      - name: Load archived Docker image
        run: docker load -i image.tar
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}
      - name: Authenticate and push image to ecr
        run: |
          aws ecr get-login-password --region ${{ vars.ECR_REGION }} | docker login --username AWS --password-stdin ${{ vars.AWS_ECR_REGISTRY_ID }}.dkr.ecr.${{ vars.ECR_REGION }}.amazonaws.com
          docker tag ${{ vars.ECR_REPOSITORY }}:latest ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - name: Capture published image digest
        id: image-digest
        run: |
          set -euo pipefail
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name ${{ vars.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ github.sha }} \
            --region ${{ vars.ECR_REGION }} \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "::error::Failed to capture ECR image digest"
            exit 1
          fi
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  artifact-attestation:
    runs-on: ubuntu-latest
    needs: publish-image
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ needs.publish-image.outputs.image_digest }}

  snyk-container-monitor:
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.ref == 'refs/heads/cw-deploy'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
      - name: Load archived Docker image
        run: docker load -i image.tar
      - name: Install Snyk
        run: npm install -g snyk@${{ env.SNYK_VERSION }}
      - name: Get Snyk OAuth token
        id: snyk-auth
        uses: ./.github/actions/snyk-auth
        with:
          client-id: ${{ secrets.SNYK_CLIENT_ID }}
          client-secret: ${{ secrets.SNYK_CLIENT_SECRET }}
          api-url: ${{ vars.SNYK_API_URL || 'https://api.snyk.io' }}
      - name: Snyk container monitor
        run: snyk container monitor cica/cica-repo-dev
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.ref == 'refs/heads/cw-deploy'
    environment: dev
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - name: Authenticate with cluster
        run: |
          if [[ "${{ secrets.KUBE_CERT }}" == -----BEGIN* ]]; then
            echo -n "${{ secrets.KUBE_CERT }}" > ./live_ca.crt
          else
            echo -n "${{ secrets.KUBE_CERT }}" | base64 -d > ./live_ca.crt
          fi
          kubectl config set-cluster ${{ secrets.KUBE_CLUSTER }} --certificate-authority=./live_ca.crt --server=https://${{ secrets.KUBE_CLUSTER }}
          kubectl config set-credentials github-actions --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context ${{ secrets.KUBE_CLUSTER }} --cluster=${{ secrets.KUBE_CLUSTER }} --user=github-actions --namespace=claim-criminal-injuries-compensation-dev
          kubectl config use-context ${{ secrets.KUBE_CLUSTER }}
          kubectl config current-context
          kubectl --namespace=claim-criminal-injuries-compensation-dev get pods
      - name: Deploy to the cluster
        run: |
          kubectl set image -f kube_deploy/Dev/deploy.yml webapp=${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} --local -o yaml \
          | kubectl apply -n claim-criminal-injuries-compensation-dev -f -
          kubectl apply \
              -f kube_deploy/Dev/service.yml \
              -f kube_deploy/Dev/ingress.yml
          kubectl apply -k kube_deploy/Dev
          kubectl rollout restart deployment/custom-errors -n claim-criminal-injuries-compensation-dev
          kubectl rollout status deployment/custom-errors -n claim-criminal-injuries-compensation-dev

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/cw-deploy'
    environment: prod
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - name: Authenticate with cluster
        run: |
          if [[ "${{ secrets.KUBE_CERT }}" == -----BEGIN* ]]; then
            echo -n "${{ secrets.KUBE_CERT }}" > ./live_ca.crt
          else
            echo -n "${{ secrets.KUBE_CERT }}" | base64 -d > ./live_ca.crt
          fi
          kubectl config set-cluster ${{ secrets.KUBE_CLUSTER }} --certificate-authority=./live_ca.crt --server=https://${{ secrets.KUBE_CLUSTER }}
          kubectl config set-credentials github-actions --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context ${{ secrets.KUBE_CLUSTER }} --cluster=${{ secrets.KUBE_CLUSTER }} --user=github-actions --namespace=claim-criminal-injuries-compensation-prod
          kubectl config use-context ${{ secrets.KUBE_CLUSTER }}
          kubectl config current-context
          kubectl --namespace=claim-criminal-injuries-compensation-prod get pods
      - name: Deploy to the cluster
        run: |
          kubectl set image -f kube_deploy/Prod/deploy.yml webapp=${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} --local -o yaml \
          | kubectl apply -n claim-criminal-injuries-compensation-prod -f -
          kubectl apply \
              -f kube_deploy/Prod/service.yml \
              -f kube_deploy/Prod/ingress.yml
          kubectl apply -k kube_deploy/Prod
          kubectl rollout restart deployment/custom-errors -n claim-criminal-injuries-compensation-prod
          kubectl rollout status deployment/custom-errors -n claim-criminal-injuries-compensation-prod

  deploy-uat:
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.ref == 'refs/heads/cw-deploy-to-uat'
    environment: uat
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - name: Authenticate with cluster
        run: |
          if [[ "${{ secrets.KUBE_CERT }}" == -----BEGIN* ]]; then
            echo -n "${{ secrets.KUBE_CERT }}" > ./live_ca.crt
          else
            echo -n "${{ secrets.KUBE_CERT }}" | base64 -d > ./live_ca.crt
          fi
          kubectl config set-cluster ${{ secrets.KUBE_CLUSTER }} --certificate-authority=./live_ca.crt --server=https://${{ secrets.KUBE_CLUSTER }}
          kubectl config set-credentials github-actions --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context ${{ secrets.KUBE_CLUSTER }} --cluster=${{ secrets.KUBE_CLUSTER }} --user=github-actions --namespace=claim-criminal-injuries-compensation-uat
          kubectl config use-context ${{ secrets.KUBE_CLUSTER }}
          kubectl config current-context
          kubectl --namespace=claim-criminal-injuries-compensation-uat get pods
      - name: Deploy to the cluster
        run: |
          kubectl set image -f kube_deploy/Uat/deploy.yml webapp=${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} --local -o yaml \
          | kubectl apply -n claim-criminal-injuries-compensation-uat -f -
          kubectl apply \
              -f kube_deploy/Uat/service.yml \
              -f kube_deploy/Uat/ingress.yml
          kubectl apply -k kube_deploy/Uat
          kubectl rollout restart deployment/custom-errors -n claim-criminal-injuries-compensation-uat
          kubectl rollout status deployment/custom-errors -n claim-criminal-injuries-compensation-uat

  deploy-staging:
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.ref == 'refs/heads/cw-deploy-to-staging'
    environment: staging
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - name: Authenticate with cluster
        run: |
          if [[ "${{ secrets.KUBE_CERT }}" == -----BEGIN* ]]; then
            echo -n "${{ secrets.KUBE_CERT }}" > ./live_ca.crt
          else
            echo -n "${{ secrets.KUBE_CERT }}" | base64 -d > ./live_ca.crt
          fi
          kubectl config set-cluster ${{ secrets.KUBE_CLUSTER }} --certificate-authority=./live_ca.crt --server=https://${{ secrets.KUBE_CLUSTER }}
          kubectl config set-credentials github-actions --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context ${{ secrets.KUBE_CLUSTER }} --cluster=${{ secrets.KUBE_CLUSTER }} --user=github-actions --namespace=claim-criminal-injuries-compensation-stag
          kubectl config use-context ${{ secrets.KUBE_CLUSTER }}
          kubectl config current-context
          kubectl --namespace=claim-criminal-injuries-compensation-stag get pods
      - name: Deploy to the cluster
        run: |
          kubectl set image -f kube_deploy/Stag/deploy.yml webapp=${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} --local -o yaml \
          | kubectl apply -n claim-criminal-injuries-compensation-stag -f -
          kubectl apply \
              -f kube_deploy/Stag/service.yml \
              -f kube_deploy/Stag/ingress.yml
          kubectl apply -k kube_deploy/Stag
          kubectl rollout restart deployment/custom-errors -n claim-criminal-injuries-compensation-stag
          kubectl rollout status deployment/custom-errors -n claim-criminal-injuries-compensation-stag
